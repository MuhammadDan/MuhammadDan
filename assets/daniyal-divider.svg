<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="auto" role="separator" aria-label="Section Divider">
  <defs>
    <linearGradient id="mdk-div-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="mdk-div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="mdk-div-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="-0.3;1.0" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="0.9">
        <animate attributeName="offset" values="0.0;1.3" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="0.3;1.6" dur="3.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="mdk-div-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Midnight Background - Completely Eliminates GitHub Grey Gaps -->
  <rect width="1200" height="36" fill="url(#mdk-div-bg)" />

  <!-- Divider Line Track -->
  <line x1="60" y1="18" x2="1140" y2="18" stroke="url(#mdk-div-grad)" stroke-width="1.2" />
  <!-- Traveling Light Pulse -->
  <line x1="60" y1="18" x2="1140" y2="18" stroke="url(#mdk-div-pulse)" stroke-width="2" filter="url(#mdk-div-glow)" />

  <!-- Center Floating Tech Diamond Beacon -->
  <g transform="translate(600, 18)">
    <circle cx="0" cy="0" r="10" fill="#701A3D" opacity="0.4" filter="url(#mdk-div-glow)">
      <animate attributeName="r" values="8;14;8" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <rect x="-5" y="-5" width="10" height="10" fill="#190B12" stroke="#C77B9B" stroke-width="1.2" transform="rotate(45)" />
    <circle cx="0" cy="0" r="2" fill="#F8F0F3">
      <animate attributeName="r" values="1.5;2.8;1.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
