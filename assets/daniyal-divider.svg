      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.3" />
