<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto" role="img" aria-label="Muhammad Daniyal Khan - Education and Verified Credentials">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edu-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C">
        <animate attributeName="stop-color" values="#10070C;#190B12;#10070C" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#190B12">
        <animate attributeName="stop-color" values="#190B12;#451126;#190B12" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10070C">
        <animate attributeName="stop-color" values="#10070C;#190B12;#10070C" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Top Border Highlight -->
    <linearGradient id="edu-top-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1">
        <animate attributeName="stop-color" values="#E5B5C7;#F8F0F3;#C77B9B;#E5B5C7" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <!-- Moving Beam Gradient for Underline -->
    <linearGradient id="edu-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="-0.5; 1.0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="-0.2; 1.3" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1">
        <animate attributeName="offset" values="0.0; 1.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.2; 1.7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="0.5; 2.0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Sweeping Laser Scan Line -->
    <linearGradient id="edu-laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="45%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Breathing Glow -->
    <radialGradient id="edu-glow-pulse" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.2;0.45;0.2" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <filter id="edu-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="edu-grid-pat" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#451126" stroke-width="0.7" stroke-opacity="0.2" />
      <circle cx="36" cy="36" r="0.8" fill="#701A3D" fill-opacity="0.3" />
    </pattern>
  </defs>

  
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .serif { font-family: "Playfair Display", Georgia, Cambria, "Times New Roman", serif; }

    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion {
        animation: none !important;
      }
    }
  </style>


  <!-- Canvas Surface -->
  <rect width="1200" height="500" rx="16" fill="url(#edu-bg-grad)" />
  <rect width="1200" height="500" rx="16" fill="url(#edu-glow-pulse)" />
  <rect x="2" y="2" width="1196" height="496" rx="15" fill="url(#edu-grid-pat)" />

  <!-- Borders -->
  <rect x="1" y="1" width="1198" height="498" rx="15" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity="0.45" />
  <line x1="40" y1="1" x2="1160" y2="1" stroke="url(#edu-top-glow)" stroke-width="2" />

  <!-- Corner Precision Accents -->
  <path d="M 16 32 L 32 32 L 32 16" fill="none" stroke="#701A3D" stroke-width="1.2" opacity="0.6" />
  <path d="M 1184 32 L 1168 32 L 1168 16" fill="none" stroke="#701A3D" stroke-width="1.2" opacity="0.6" />
  <path d="M 16 468 L 32 468 L 32 484" fill="none" stroke="#701A3D" stroke-width="1.2" opacity="0.6" />
  <path d="M 1184 468 L 1168 468 L 1168 484" fill="none" stroke="#701A3D" stroke-width="1.2" opacity="0.6" />

  <!-- Sweeping Laser Scan Line -->
  <g opacity="0.75">
    <rect y="2" width="60" height="496" fill="url(#edu-laser-grad)">
      <animate attributeName="x" values="30;1110;30" dur="7.5s" repeatCount="indefinite" />
    </rect>
    <line y1="2" y2="498" stroke="#F8F0F3" stroke-width="1.5" opacity="0.8" filter="url(#edu-bloom)">
      <animate attributeName="x1" values="60;1140;60" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="60;1140;60" dur="7.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(50, 42)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="-3" r="3.5" fill="#C77B9B">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="0" class="mono" font-size="10.5" font-weight="600" fill="#C77B9B" letter-spacing="2">05 • ACADEMIC &amp; VERIFIED CREDENTIALS</text>
    </g>

    <text x="0" y="32" class="sans" font-size="28" font-weight="800" fill="#F8F0F3" letter-spacing="0.5">
      EDUCATION &amp; CERTIFICATIONS <tspan class="serif" font-style="italic" font-weight="400" font-size="20" fill="#E5B5C7">— Verified Records</tspan>
    </text>

    <!-- Animated Glowing Underline -->
    <g transform="translate(0, 44)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#451126" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="0" x2="680" y2="0" stroke="url(#edu-beam-grad)" stroke-width="2.5" filter="url(#edu-bloom)" />
      <line x1="0" y1="0" x2="0" y2="0" stroke="#E5B5C7" stroke-width="2">
        <animate attributeName="x2" values="0;680;580;680" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;1;0.7;1" dur="4.5s" repeatCount="indefinite" />
      </line>
    </g>
  </g>

  <!-- ==================== TWO SIDE-BY-SIDE CREDENTIAL CARDS ==================== -->

  <!-- LEFT CARD: VERIFIED ACADEMIC EDUCATION -->
  <g transform="translate(50, 115)">
    <rect width="535" height="340" rx="12" fill="#190B12" stroke="#451126" stroke-width="1.2" />
    <rect x="0" y="0" width="535" height="340" rx="12" fill="none" stroke="#701A3D" stroke-width="0.5" stroke-opacity="0.6" />

    <!-- Card Badge -->
    <g transform="translate(24, 20)">
      <rect width="195" height="22" rx="11" fill="#10070C" stroke="#701A3D" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#C77B9B" />
      <text x="20" y="15" class="mono" font-size="9.5" font-weight="600" fill="#E5B5C7" letter-spacing="0.8">ACCREDITED DEGREES</text>
    </g>

    <!-- Degree 1 -->
    <g transform="translate(24, 62)">
      <text x="0" y="14" class="sans" font-size="16" font-weight="700" fill="#F8F0F3">Bachelor in Computer Science (BSCS)</text>
      <text x="0" y="32" class="mono" font-size="11" font-weight="600" fill="#C77B9B">University of Karachi · Karachi, Pakistan</text>
      <text x="0" y="48" class="mono" font-size="10.5" fill="#E5B5C7">Graduation Cycle: 2021 – 2025</text>
      <text x="0" y="66" class="sans" font-size="12" fill="#E5B5C7" opacity="0.9">
        Rigorous focus in Software Engineering, Algorithms, Database Systems, and Architecture.
      </text>
    </g>

    <line x1="24" y1="150" x2="511" y2="150" stroke="#451126" stroke-width="1" opacity="0.6" />

    <!-- Degree 2 -->
    <g transform="translate(24, 168)">
      <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#F8F0F3">Intermediate in Pre-Engineering (HSC)</text>
      <text x="0" y="32" class="mono" font-size="11" font-weight="600" fill="#C77B9B">Govt Delhi Inter Science College · Karachi, Pakistan</text>
      <text x="0" y="48" class="mono" font-size="10.5" fill="#E5B5C7">Higher Secondary Certificate: 2019 – 2021</text>
    </g>

    <line x1="24" y1="236" x2="511" y2="236" stroke="#451126" stroke-width="1" opacity="0.6" />

    <!-- Degree 3 -->
    <g transform="translate(24, 252)">
      <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#F8F0F3">Matriculation in Science Group</text>
      <text x="0" y="32" class="mono" font-size="11" font-weight="600" fill="#C77B9B">Programmer School (Karachi Board) · Karachi, Pakistan</text>
      <text x="0" y="48" class="mono" font-size="10.5" fill="#E5B5C7">Secondary School Certificate: 2018 – 2019</text>
    </g>

    <!-- Mini Progress Bar -->
    <g transform="translate(24, 318)">
      <rect width="487" height="3" rx="1.5" fill="#10070C" />
      <rect height="3" rx="1.5" fill="#C77B9B">
        <animate attributeName="width" values="240;487;360;487" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- RIGHT CARD: VERIFIED CERTIFICATIONS & COURSES -->
  <g transform="translate(615, 115)">
    <rect width="535" height="340" rx="12" fill="#190B12" stroke="#451126" stroke-width="1.2" />
    <rect x="0" y="0" width="535" height="340" rx="12" fill="none" stroke="#701A3D" stroke-width="0.5" stroke-opacity="0.6" />

    <!-- Card Badge -->
    <g transform="translate(24, 20)">
      <rect width="205" height="22" rx="11" fill="#10070C" stroke="#701A3D" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#E5B5C7" />
      <text x="20" y="15" class="mono" font-size="9.5" font-weight="600" fill="#E5B5C7" letter-spacing="0.8">VERIFIED CREDENTIALS</text>
    </g>

    <!-- 7 Verified Certifications List -->
    <g transform="translate(24, 58)">
      <!-- Cert 1 -->
      <g transform="translate(0, 0)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">JavaScript Specialization</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">Coursera Verified</text>
      </g>
      <!-- Cert 2 -->
      <g transform="translate(0, 32)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">Legacy JavaScript DSA</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">freeCodeCamp Verified</text>
      </g>
      <!-- Cert 3 -->
      <g transform="translate(0, 64)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">React JS (Basic)</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">HackerRank Verified</text>
      </g>
      <!-- Cert 4 -->
      <g transform="translate(0, 96)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">Next.js Full Course</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">Udemy Verified</text>
      </g>
      <!-- Cert 5 -->
      <g transform="translate(0, 128)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">Introduction to ASP.NET</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">Simplilearn Accredited</text>
      </g>
      <!-- Cert 6 -->
      <g transform="translate(0, 160)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">Web &amp; Mobile App Development</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">Saylani SMIT Verified</text>
      </g>
      <!-- Cert 7 -->
      <g transform="translate(0, 192)">
        <circle cx="4" cy="9" r="2.5" fill="#C77B9B" />
        <text x="14" y="13" class="sans" font-size="13" font-weight="600" fill="#F8F0F3">Master Course in ChatGPT</text>
        <text x="260" y="13" class="mono" font-size="11" fill="#E5B5C7">Udemy Verified</text>
      </g>
    </g>

    <!-- Mini Progress Bar -->
    <g transform="translate(24, 318)">
      <rect width="487" height="3" rx="1.5" fill="#10070C" />
      <rect height="3" rx="1.5" fill="#701A3D">
        <animate attributeName="width" values="180;487;320;487" dur="3.6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ==================== BOTTOM TELEMETRY BAR ==================== -->
  <g transform="translate(50, 480)">
    <circle cx="4" cy="-3" r="3" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="0" class="mono" font-size="9.5" fill="#C77B9B" letter-spacing="1">
      ACADEMIC &amp; GLOBAL CERTIFICATE LEDGER // VERIFICATION TOKENS AUDITED
    </text>
  </g>
  <g transform="translate(1150, 480)">
    <text x="0" y="0" text-anchor="end" class="mono" font-size="9.5" fill="#E5B5C7" letter-spacing="1" opacity="0.8">
      STATUS: VERIFIED CREDENTIALS ACTIVE
    </text>
  </g>
</svg>