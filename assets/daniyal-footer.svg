<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="auto" role="img" aria-label="Muhammad Daniyal Khan - Profile Footer">
  <defs>
    <linearGradient id="mdk-footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="mdk-line-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <filter id="mdk-footer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="120" fill="url(#mdk-footer-bg)" rx="12" />
  <rect x="1" y="1" width="1198" height="118" fill="none" stroke="#451126" stroke-width="1" stroke-opacity="0.6" rx="11" />

  <!-- Divider Accent Line -->
  <line x1="80" y1="28" x2="1120" y2="28" stroke="url(#mdk-line-accent)" stroke-width="1.5" />

  <!-- Center Floating Tech Diamond Beacon -->
  <g transform="translate(600, 28)">
    <!-- Halo glow -->
    <circle cx="0" cy="0" r="14" fill="#701A3D" opacity="0.3" filter="url(#mdk-footer-glow)">
      <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Outer rotated square (diamond) -->
    <rect x="-7" y="-7" width="14" height="14" fill="#190B12" stroke="#C77B9B" stroke-width="1.2" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="16s" repeatCount="indefinite" />
    </rect>
    <!-- Core glowing pip -->
    <circle cx="0" cy="0" r="3" fill="#F8F0F3">
      <animate attributeName="r" values="2.5;3.8;2.5" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Corner Brackets -->
  <path d="M 16 20 L 26 20 L 26 10" fill="none" stroke="#701A3D" stroke-width="1" opacity="0.7" />
  <path d="M 1184 20 L 1174 20 L 1174 10" fill="none" stroke="#701A3D" stroke-width="1" opacity="0.7" />
  <path d="M 16 100 L 26 100 L 26 110" fill="none" stroke="#701A3D" stroke-width="1" opacity="0.7" />
  <path d="M 1184 100 L 1174 100 L 1174 110" fill="none" stroke="#701A3D" stroke-width="1" opacity="0.7" />

  <!-- Primary Footer Text -->
  <text x="600" y="66" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#F8F0F3" letter-spacing="1.5">
    DESIGNED &amp; ENGINEERED BY MUHAMMAD DANIYAL KHAN
  </text>

  <!-- Secondary Metadata Line -->
  <text x="600" y="92" text-anchor="middle" class="mono" font-size="11" fill="#C77B9B" letter-spacing="1">
    FULL-STACK WEB &amp; MOBILE DEVELOPMENT // KARACHI, PAKISTAN // CONSTANTLY EVOLVING
  </text>
</svg>

