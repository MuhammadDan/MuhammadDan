<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" role="img" aria-label="Muhammad Daniyal Khan - Full Stack Software Developer">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="mdk-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="mdk-glow-burgundy" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mdk-glow-rose" cx="25%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#701A3D" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Stroke Gradient -->
    <linearGradient id="mdk-stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Moving Glow Underline Gradient -->
    <linearGradient id="mdk-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="-0.5; 1.0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="-0.25; 1.25" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1">
        <animate attributeName="offset" values="0.0; 1.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.25; 1.75" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0">
        <animate attributeName="offset" values="0.5; 2.0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="mdk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#451126" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#701A3D" fill-opacity="0.4" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="mdk-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mdk-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#mdk-bg-grad)" rx="16" />

  <!-- Ambient Pulsing Glow Fields -->
  <rect width="1200" height="420" fill="url(#mdk-glow-burgundy)" rx="16">
    <animate attributeName="opacity" values="0.75; 1; 0.75" dur="6s" repeatCount="indefinite" />
  </rect>
  <rect width="1200" height="420" fill="url(#mdk-glow-rose)" rx="16">
    <animate attributeName="opacity" values="0.6; 0.9; 0.6" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Technical Grid Overlay -->
  <rect x="1" y="1" width="1198" height="418" fill="url(#mdk-grid)" rx="15" />

  <!-- Outer Border with Rounded Corners -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#451126" stroke-width="1.5" stroke-opacity="0.6" rx="15" />
  <rect x="3" y="3" width="1194" height="414" fill="none" stroke="#701A3D" stroke-width="0.5" stroke-opacity="0.4" rx="13" />

  <!-- Precision Corner Reticles -->
  <path d="M 16 32 L 32 32 L 32 16" fill="none" stroke="#C77B9B" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 1184 32 L 1168 32 L 1168 16" fill="none" stroke="#C77B9B" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 16 388 L 32 388 L 32 404" fill="none" stroke="#C77B9B" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 1184 388 L 1168 388 L 1168 404" fill="none" stroke="#C77B9B" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Coordinate Crosshairs -->
  <g stroke="#701A3D" stroke-width="1" stroke-opacity="0.5">
    <line x1="60" y1="52" x2="60" y2="68" />
    <line x1="52" y1="60" x2="68" y2="60" />
    <line x1="1140" y1="52" x2="1140" y2="68" />
    <line x1="1132" y1="60" x2="1148" y2="60" />
    <line x1="60" y1="352" x2="60" y2="368" />
    <line x1="52" y1="360" x2="68" y2="360" />
  </g>

  <!-- Subtle Top System Label -->
  <text x="76" y="64" class="mono" font-size="10" fill="#C77B9B" letter-spacing="2" opacity="0.75">SYSTEM: DEV-IDENTITY // NODE.2026 // KARACHI, PK [24.8607° N, 67.0011° E]</text>

  <!-- ==================== RIGHT SIDE: ORBITAL GEOMETRY ==================== -->
  <g transform="translate(980, 210)">
    <!-- Outer Orbital Ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#451126" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite" />
    </circle>

    <!-- Middle Orbital Ring with Reverse Spin -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#701A3D" stroke-width="1.4" stroke-dasharray="14 10" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Continuous Ring with Glow -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#C77B9B" stroke-width="1.2" opacity="0.4" filter="url(#mdk-subtle-glow)" />

    <!-- Core Center Node -->
    <circle cx="0" cy="0" r="22" fill="#190B12" stroke="#701A3D" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#C77B9B" opacity="0.9">
      <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3" fill="#F8F0F3" />

    <!-- Satellite 1 on Outer Ring -->
    <g>
      <circle cx="0" cy="0" r="4.5" fill="#E5B5C7" filter="url(#mdk-glow-filter)">
        <animateMotion dur="24s" repeatCount="indefinite" path="M 0,-145 A 145,145 0 1,1 0,145 A 145,145 0 1,1 0,-145" />
      </circle>
    </g>

    <!-- Satellite 2 on Middle Ring -->
    <g>
      <circle cx="0" cy="0" r="3" fill="#C77B9B">
        <animateMotion dur="14s" repeatCount="indefinite" path="M 105,0 A 105,105 0 1,0 -105,0 A 105,105 0 1,0 105,0" />
      </circle>
    </g>

    <!-- Crosshair ticks on the center -->
    <line x1="-160" y1="0" x2="-140" y2="0" stroke="#701A3D" stroke-width="1" opacity="0.5" />
    <line x1="140" y1="0" x2="160" y2="0" stroke="#701A3D" stroke-width="1" opacity="0.5" />
    <line x1="0" y1="-160" x2="0" y2="-140" stroke="#701A3D" stroke-width="1" opacity="0.5" />
    <line x1="0" y1="140" x2="0" y2="160" stroke="#701A3D" stroke-width="1" opacity="0.5" />
  </g>

  <!-- ==================== LEFT SIDE: MAIN CONTENT ==================== -->
  
  <!-- Status Badge Pill -->
  <g transform="translate(80, 100)">
    <rect width="320" height="30" rx="15" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <!-- Pulsing Status Light -->
    <circle cx="18" cy="15" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="15" r="7" fill="none" stroke="#E5B5C7" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="mono" font-size="11" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">OPEN TO IMPACTFUL OPPORTUNITIES</text>
  </g>

  <!-- Primary Name Headline -->
  <text x="80" y="185" class="sans" font-size="52" font-weight="800" fill="#F8F0F3" letter-spacing="-0.5" filter="url(#mdk-subtle-glow)">
    MUHAMMAD DANIYAL KHAN
  </text>

  <!-- Glowing Underline Accent -->
  <g transform="translate(80, 202)">
    <!-- Base track line -->
    <line x1="0" y1="0" x2="680" y2="0" stroke="#451126" stroke-width="2" opacity="0.7" />
    <!-- Animated Light Pulse Beam -->
    <line x1="0" y1="0" x2="680" y2="0" stroke="url(#mdk-beam-grad)" stroke-width="2.5" filter="url(#mdk-glow-filter)" />
    <!-- Tiny Terminal Accent Dot -->
    <circle cx="680" cy="0" r="2.5" fill="#C77B9B" />
  </g>

  <!-- Role Subtitle -->
  <text x="80" y="242" class="sans" font-size="22" font-weight="600" fill="#E5B5C7" letter-spacing="0.5">
    Software Developer · Full-Stack Web &amp; Mobile Architecture
  </text>

  <!-- Specialty Focus Summary -->
  <text x="80" y="272" class="mono" font-size="13" font-weight="400" fill="#C77B9B" letter-spacing="0.8">
    Crafting Resilient Backends, Type-Safe APIs &amp; High-Performance Reactive Interfaces
  </text>

  <!-- ==================== BOTTOM TECH STACK PILLS ==================== -->
  <g transform="translate(80, 315)">
    <!-- Pill 1: Next.js & React -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" rx="8" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="16" cy="17" r="3" fill="#C77B9B" />
      <text x="28" y="22" class="mono" font-size="11.5" font-weight="500" fill="#F8F0F3" letter-spacing="0.5">Next.js · React</text>
    </g>

    <!-- Pill 2: Node.js & Fastify -->
    <g transform="translate(172, 0)">
      <rect width="175" height="34" rx="8" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="16" cy="17" r="3" fill="#C77B9B" />
      <text x="28" y="22" class="mono" font-size="11.5" font-weight="500" fill="#F8F0F3" letter-spacing="0.5">Node.js · Fastify</text>
    </g>

    <!-- Pill 3: React Native & Kotlin -->
    <g transform="translate(359, 0)">
      <rect width="215" height="34" rx="8" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="16" cy="17" r="3" fill="#C77B9B" />
      <text x="28" y="22" class="mono" font-size="11.5" font-weight="500" fill="#F8F0F3" letter-spacing="0.5">React Native · Kotlin</text>
    </g>

    <!-- Pill 4: Docker & PostgreSQL -->
    <g transform="translate(586, 0)">
      <rect width="195" height="34" rx="8" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="16" cy="17" r="3" fill="#C77B9B" />
      <text x="28" y="22" class="mono" font-size="11.5" font-weight="500" fill="#F8F0F3" letter-spacing="0.5">Docker · SQL &amp; PG</text>
    </g>
  </g>

  <!-- Subtle Bottom Circuit Line -->
  <g opacity="0.6">
    <path d="M 80 382 L 400 382 L 420 402 L 950 402" fill="none" stroke="#451126" stroke-width="1" />
    <circle cx="80" cy="382" r="2" fill="#701A3D" />
    <circle cx="950" cy="402" r="2" fill="#701A3D" />
    <!-- Traveling Data Packet on Circuit -->
    <circle r="2" fill="#E5B5C7">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 80 382 L 400 382 L 420 402 L 950 402" />
    </circle>
  </g>
</svg>

